<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인의 스타일 조사(DISC) · 인간관계와 예절</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2fb; --panel:#ffffff; --panel-2:#f3f6fc; --line:rgba(30,50,110,.14);
  --text:#18244a; --muted:#5a6788; --accent:#3b55b8; --accent-ink:#ffffff;
  --star:rgba(40,60,130,.35);
  --D:#d24f45; --I:#b07d06; --S:#1d8f72; --C:#356fd0;
  --shadow:0 1px 0 rgba(30,50,110,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b152e; --panel:#122049; --panel-2:#17285a; --line:rgba(180,200,255,.16);
    --text:#e9eefc; --muted:#9fb0d6; --accent:#b9c8ff; --accent-ink:#0b152e;
    --star:rgba(210,225,255,.7);
    --D:#ff8a78; --I:#f5c451; --S:#62d2ae; --C:#7fb2ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0b152e; --panel:#122049; --panel-2:#17285a; --line:rgba(180,200,255,.16);
  --text:#e9eefc; --muted:#9fb0d6; --accent:#b9c8ff; --accent-ink:#0b152e;
  --star:rgba(210,225,255,.7);
  --D:#ff8a78; --I:#f5c451; --S:#62d2ae; --C:#7fb2ff; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.65; word-break:keep-all; overflow-wrap:anywhere; min-height:100vh;
}
#sky{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
main{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:28px 18px 120px}
h1,h2,h3{font-family:"Gowun Batang","Noto Serif KR",serif; font-weight:700; line-height:1.3; margin:0}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
svg{max-width:100%}
.course{color:var(--muted); font-size:.875rem}

.hero{padding:40px 0 24px}
.hero h1{font-size:clamp(2rem,7vw,2.6rem); margin:10px 0 14px}
.hero .lead{color:var(--muted); font-size:1.05rem}
.how{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin:8px 0 24px; box-shadow:var(--shadow)}
.how h2{font-size:1.15rem; margin-bottom:10px}
.how ol{margin:0; padding-left:1.2em}
.how li{margin:5px 0}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:999px; padding:13px 24px; font-weight:600; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); min-height:48px;
}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.resume{margin-top:12px; font-size:.9rem; color:var(--muted)}

/* 문항 */
.qtitle{padding:14px 0 16px}
.qtitle h1{font-size:1.5rem; margin:4px 0 6px}
.qtitle p{color:var(--muted); font-size:.95rem}
.item{
  display:grid; grid-template-columns:2.2em 1fr; gap:6px 10px; align-items:start;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px; margin-bottom:10px; box-shadow:var(--shadow); scroll-margin-top:20px;
}
.item.missing{border-color:var(--D); box-shadow:inset 0 0 0 1px var(--D)}
.item .no{font-family:"Gowun Batang",serif; font-size:1.25rem; color:var(--muted); padding-top:6px; text-align:center}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (min-width:560px){ .choices{grid-template-columns:repeat(4,1fr)} }
.choices button{
  min-height:48px; padding:8px 6px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2); line-height:1.35; font-size:.95rem;
}
.choices button[aria-checked="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:2;
  background:var(--panel); border-top:1px solid var(--line);
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));
}
.dock-in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px}
.dock .count{flex:1; font-size:.95rem}
.dock .count b{font-family:"Gowun Batang",serif; font-size:1.2rem}
.dock .bar{height:4px; background:var(--line); border-radius:4px; margin-top:6px; overflow:hidden}
.dock .bar i{display:block; height:100%; background:var(--accent); transition:width .25s}
.dock .msg{font-size:.8rem; color:var(--D); min-height:1.2em}

/* 결과 */
.rhead{padding:26px 0 6px}
.rhead h1{font-size:1.2rem; font-family:"IBM Plex Sans KR",sans-serif; font-weight:500; color:var(--muted); margin:4px 0 12px}
.top{display:flex; flex-direction:column; gap:4px}
.top div{font-family:"Gowun Batang",serif; font-size:clamp(2rem,8.5vw,2.8rem); font-weight:700; line-height:1.25}
.top small{font-family:"IBM Plex Sans KR",sans-serif; font-size:1rem; font-weight:500; color:var(--muted); margin-right:10px}
.tie{margin-top:10px; font-size:.9rem; color:var(--muted)}
.chart{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:22px 0; box-shadow:var(--shadow)}
.chart svg{display:block; width:100%; height:auto}
.chart svg text{font-family:"IBM Plex Sans KR",sans-serif}
.tally{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px; text-align:center}
.tally div{padding:8px 4px; border-radius:8px; background:var(--panel-2)}
.tally b{display:block; font-family:"Gowun Batang",serif; font-size:1.5rem; line-height:1.2}
.tally span{font-size:.8rem; color:var(--muted)}
.tally .dim{opacity:.55}

.style{margin:28px 0}
.style h2{font-size:1.4rem}
.style .en{color:var(--muted); font-size:.9rem; margin:2px 0 12px}
.pc{display:grid; grid-template-columns:1fr; gap:10px}
@media (min-width:560px){ .pc{grid-template-columns:1fr 1fr} }
.pc section{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.pc section.plus{border-top:3px solid var(--tc)}
.pc section.minus{border-top:3px dashed var(--tc)}
.pc h3{font-family:"IBM Plex Sans KR",sans-serif; font-size:1rem; font-weight:600; margin-bottom:6px}
.pc ul{margin:0; padding-left:1.1em}
.pc li{margin:3px 0}

.reflect{margin:30px 0 0; border-top:1px solid var(--line); padding-top:20px}
.reflect h2{font-size:1.25rem; margin-bottom:10px}
.reflect ol{margin:0; padding-left:1.3em}
.reflect li{margin:8px 0}
.stamp{font-size:.85rem; color:var(--muted); margin-top:22px}
.fine{font-size:.85rem; color:var(--muted); margin-top:10px}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main id="app" aria-live="polite"></main>
<div class="dock" id="dock" hidden></div>

<script>
/* 활동지 문항: 각 행은 A~D 순서, 뒤의 글자는 채점표(ㄱ=D, ㄴ=I, ㄷ=S, ㄹ=C)에 따른 유형 */
const ITEMS = [
  [["절제하는","S"],["강력한","D"],["꼼꼼한","C"],["표현력 있는","I"]],
  [["개척적인","D"],["정확한","C"],["흥미진진한","I"],["만족스러운","S"]],
  [["기꺼이 하는","S"],["활기 있는","I"],["대담한","D"],["정교한","C"]],
  [["논쟁을 좋아하는","D"],["회의적인","C"],["주저하는","S"],["예측할 수 없는","I"]],
  [["공손한","C"],["사교적인","I"],["참을성이 있는","S"],["무서움을 모르는","D"]],
  [["설득력 있는","I"],["독립심이 강한","D"],["논리적인","C"],["온화한","S"]],
  [["신중한","C"],["차분한","S"],["과단성 있는","D"],["파티를 좋아하는","I"]],
  [["인기 있는","I"],["고집 있는","D"],["완벽주의자","C"],["인심 좋은","S"]],
  [["변화가 많은","I"],["수줍음을 타는","C"],["느긋한","S"],["완고한","D"]],
  [["체계적인","C"],["낙관적인","I"],["의지가 강한","D"],["친절한","S"]],
  [["엄격한","D"],["겸손한","C"],["상냥한","S"],["말주변이 좋은","I"]],
  [["호의적인","S"],["빈틈없는","C"],["놀기 좋아하는","I"],["의지가 강한","D"]],
  [["참신한","I"],["모험적인","D"],["절제된","C"],["신중한","S"]],
  [["참는","C"],["성실한","S"],["공격적인","D"],["매력 있는","I"]],
  [["열정적인","I"],["분석적인","C"],["동정심이 많은","S"],["단호한","D"]],
  [["지도력 있는","D"],["충동적인","I"],["느린","S"],["비판적인","C"]],
  [["일관성 있는","C"],["영향력 있는","D"],["생기 있는","I"],["느긋한","S"]],
  [["유력한","I"],["친절한","S"],["독립적인","D"],["정돈된","C"]],
  [["이상주의적인","C"],["평판이 좋은","I"],["쾌활한","S"],["솔직한","D"]],
  [["참을성 없는","D"],["진지한","C"],["미루는","S"],["감성적인","I"]],
  [["경쟁심이 있는","D"],["자발적인","I"],["충성스러운","S"],["사려 깊은","C"]],
  [["희생적인","C"],["이해심 많은","S"],["설득력 있는","I"],["용기 있는","D"]],
  [["의존적인","S"],["변덕스러운","I"],["절제력 있는","C"],["밀어붙이는","D"]],
  [["포용력 있는","S"],["전통적인","C"],["사람을 부추기는","I"],["이끌어 가는","D"]]
];

/* 결과지 내용 */
const TYPES = {
  D:{name:"주도형", en:"D (Dominant) 스타일",
     plus:["즉시 성과를 올린다","신속한 결정을 내린다","포기하지 않는다","책임을 떠맡는다","자신감이 있다","도전을 받아들인다","열심히 일한다","문제를 피하지 않고 해결하려 한다"],
     minus:["조급하다","다른 사람에 대해 무관심하다","위험 부담과 경고를 간과한다","융통성이 없고 고집이 세다","지나치게 많은 일을 떠맡는다","세부사항을 무시한다","제한받는 것을 참지 못한다","다른 사람들에게 너무 많은 요구를 한다"]},
  I:{name:"사교형", en:"I (Influence) 스타일",
     plus:["낙관적이다","표현력이 좋다","즐거운 분위기를 만든다","좋은 인상을 준다","인간적이다","다른 사람들을 잘 설득한다","외향적이고 사람들을 잘 사귄다","열정적이다"],
     minus:["일의 끝마무리가 부족하다","너무 말을 많이 한다","충동적으로 행동한다","급하게 결론을 내린다","무리하게 약속을 한다","교묘한 말로 설득한다","자기 능력을 과대평가한다","결과에 대해 지나치게 낙관적이다"]},
  S:{name:"안정형", en:"S (Steadiness) 스타일",
     plus:["협조적이다","쉽게 동의한다","충성스럽다","남을 잘 섬긴다","꾸준하다","작업 수행이 안정되어 있다","대인관계가 원만하다","다른 사람의 의견을 잘 들어 준다"],
     minus:["급격한 변화를 꺼린다","지나치게 관대하다","일을 미룬다","우유부단하다","갈등을 회피한다","감정을 잘 표현하지 않는다","피동적이다","정해진 기간에 일을 마치기 어렵다"]},
  C:{name:"신중형", en:"C (Conscientious) 스타일",
     plus:["정리정돈을 잘한다","유능하다","자기 훈련을 잘한다","정확하다","철저하다","외교적 수완이 있다","분석적이다","높은 기준을 가지고 있다"],
     minus:["지나치게 조심스럽다","세부적인 일에 얽매인다","일하는 방법에 융통성이 없다","비판하기를 좋아한다","자발성이 약하다","의심이 많다","비판에 예민하게 반응한다","비관적이다"]}
};
const ORDER = ["D","I","S","C"];
const QUESTIONS = [
  "나는 관계에 있어서 주도적인 사람인가, 반응적인 사람인가?",
  "나를 움직이게 하는 가장 큰 요인은 목적 의식인가 관계성인가?",
  "나의 강점과 약점은 무엇이고, 그것들은 나의 스타일과 어떤 관련성을 맺고 있는가?",
  "나의 강점을 강화하고, 약점을 보완하기 위해 어떤 시도를 해 볼 수 있을까?"
];
const KEY = "disc-worksheet-2026";

let state = load() || fresh();
function fresh(){ return {step:"intro", picks:Array(ITEMS.length).fill(null), doneAt:null}; }
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && Array.isArray(v.picks) && v.picks.length===ITEMS.length ? v : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const app = document.getElementById("app"), dock = document.getElementById("dock");
const answered = () => state.picks.filter(p => p!==null).length;
function go(step){ state.step = step; save(); render(); window.scrollTo(0,0); }
function render(){
  dock.hidden = state.step!=="quiz";
  if(state.step==="quiz") return renderQuiz();
  if(state.step==="result") return renderResult();
  renderIntro();
}

/* ---------- 시작 ---------- */
function renderIntro(){
  const n = answered(), all = n===ITEMS.length, part = n>0 && !all;
  app.innerHTML = `
    <section class="hero">
      <p class="course">2026 인간관계와 예절</p>
      <h1>개인의 스타일 조사<br>(DISC)</h1>
      <p class="lead">모든 사람은 자신의 스타일을 가지고 있습니다. 나는 어떤 방식으로 일하고 관계를 맺는지 살펴봅시다.</p>
    </section>
    <section class="how">
      <h2>응답 방법</h2>
      <ol>
        <li>모두 ${ITEMS.length}문항이며, 한 문항에 네 가지 표현이 있습니다.</li>
        <li>네 표현 중 나를 가장 잘 설명한다고 생각되는 것을 하나 고릅니다.</li>
        <li>되고 싶은 모습보다 평소의 나를 떠올리며 고르세요.</li>
      </ol>
    </section>
    <div class="row">
      ${part ? `<button class="btn" id="cont">이어서 응답하기</button><button class="btn ghost" id="restart">처음부터 하기</button>`
       : all ? `<button class="btn" id="see">결과 다시 보기</button><button class="btn ghost" id="restart">새로 검사하기</button>`
             : `<button class="btn" id="start">검사 시작하기</button>`}
    </div>
    ${part ? `<p class="resume">${n}문항까지 응답한 기록이 이 기기에 남아 있습니다.</p>` : ""}`;
  const $ = id => document.getElementById(id);
  $("start") && ($("start").onclick = () => { state = fresh(); go("quiz"); });
  $("cont") && ($("cont").onclick = () => go("quiz"));
  $("see") && ($("see").onclick = () => go("result"));
  $("restart") && ($("restart").onclick = () => { state = fresh(); go("quiz"); });
}

/* ---------- 문항 ---------- */
function renderQuiz(){
  app.innerHTML = `
    <div class="qtitle">
      <p class="course">2026 인간관계와 예절</p>
      <h1>개인의 스타일 조사</h1>
      <p>당신을 가장 잘 설명한다고 생각되는 표현을 문항마다 하나씩 고르세요.</p>
    </div>
    ${ITEMS.map((row,i) => `
      <div class="item" id="q${i}">
        <span class="no">${i+1}</span>
        <div class="choices" role="radiogroup" aria-label="${i+1}번 문항">
          ${row.map(([w],j) => `<button role="radio" data-i="${i}" data-j="${j}" aria-checked="${state.picks[i]===j}">${w}</button>`).join("")}
        </div>
      </div>`).join("")}`;
  app.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, j = +b.dataset.j;
    state.picks[i] = j; save();
    b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x===b));
    document.getElementById("q"+i).classList.remove("missing");
    updateDock();
  });
  updateDock();
}
function updateDock(msg){
  const n = answered(), N = ITEMS.length;
  dock.innerHTML = `<div class="dock-in">
    <div class="count"><b>${n}</b> / ${N} 응답
      <div class="bar"><i style="width:${n/N*100}%"></i></div>
      <div class="msg">${msg||""}</div></div>
    <button class="btn" id="finish">결과 보기</button></div>`;
  document.getElementById("finish").onclick = () => {
    const miss = state.picks.map((p,i)=>p===null?i:-1).filter(i=>i>=0);
    if(miss.length){
      miss.forEach(i => document.getElementById("q"+i).classList.add("missing"));
      document.getElementById("q"+miss[0]).scrollIntoView({behavior:"smooth", block:"start"});
      updateDock(`${miss.map(i=>i+1).join(", ")}번 문항에 아직 응답하지 않았습니다.`);
      return;
    }
    state.doneAt = new Date().toISOString(); go("result");
  };
}

/* ---------- 결과 ---------- */
function tally(){
  const c = {D:0,I:0,S:0,C:0};
  state.picks.forEach((j,i) => { if(j!==null) c[ITEMS[i][j][1]]++; });
  return c;
}
function renderResult(){
  if(answered()<ITEMS.length){ state.step="intro"; return render(); }
  const c = tally();
  const ranked = ORDER.slice().sort((a,b) => c[b]-c[a]);
  const cut = c[ranked[1]];
  const shown = ranked.filter(t => c[t] >= cut);
  const d = new Date(state.doneAt || Date.now());
  const stamp = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} 응답`;

  const tieNote = shown.length>2
    ? `<p class="tie">점수가 같은 스타일이 있어 ${shown.length}가지를 함께 보여 줍니다.</p>` : "";

  app.innerHTML = `
    <section class="rhead">
      <p class="course">2026 인간관계와 예절</p>
      <h1>나의 스타일은?</h1>
      <div class="top">
        ${shown.map((t,k) => `<div style="color:var(--${t})"><small>${k+1}.</small>${TYPES[t].name} <small style="margin-left:4px">${c[t]}개</small></div>`).join("")}
      </div>
      ${tieNote}
    </section>

    <section class="chart">
      ${graph(c, shown)}
      <div class="tally">
        ${ORDER.map(t => `<div class="${shown.includes(t)?"":"dim"}"><b style="color:var(--${t})">${c[t]}</b><span>${t} ${TYPES[t].name}</span></div>`).join("")}
      </div>
    </section>

    ${shown.map(t => `
      <article class="style" style="--tc:var(--${t})">
        <h2 style="color:var(--${t})">${TYPES[t].name}</h2>
        <p class="en">${TYPES[t].en}</p>
        <div class="pc">
          <section class="plus"><h3>장점</h3><ul>${TYPES[t].plus.map(x=>`<li>${x}</li>`).join("")}</ul></section>
          <section class="minus"><h3>약점</h3><ul>${TYPES[t].minus.map(x=>`<li>${x}</li>`).join("")}</ul></section>
        </div>
      </article>`).join("")}

    <section class="reflect">
      <h2>생각해 봅시다</h2>
      <ol>${QUESTIONS.map(q=>`<li>${q}</li>`).join("")}</ol>
    </section>

    <p class="stamp">${stamp}</p>
    <p class="fine">검사 결과는 사람을 고정된 유형으로 나누는 것이 아니라, 평소 행동의 경향을 살펴보는 자기 이해의 도구입니다.</p>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="again">새로 검사하기</button>
    </div>`;
  document.getElementById("again").onclick = () => { state = fresh(); go("intro"); };
}

/* 활동지 도표: 가로축 반응적↔주도적, 세로축 업무중심↔사람중심
   C 좌상, D 우상, S 좌하, I 우하. 각 사분면 대각선 위에 개수를 찍어 연결 */
function graph(c, shown){
  const W=360, H=360, cx=180, cy=178, R=128;
  const maxC = Math.max(...ORDER.map(t=>c[t]));
  const top = Math.max(12, Math.ceil(maxC/3)*3);
  const step = top/4 >= 3 ? Math.ceil(top/4/3)*3 : 3;
  const ticks = []; for(let v=step; v<=top; v+=step) ticks.push(v);
  const scale = R/top;
  const dir = {C:[-1,-1], D:[1,-1], S:[-1,1], I:[1,1]};
  const pt = t => { const k = c[t]*scale/Math.SQRT2; return [cx+dir[t][0]*k, cy+dir[t][1]*k]; };
  const poly = ["C","D","I","S"].map(t => pt(t).map(v=>v.toFixed(1)).join(",")).join(" ");

  const rings = ticks.map(v => `<rect x="${cx-v*scale/Math.SQRT2}" y="${cy-v*scale/Math.SQRT2}" width="${2*v*scale/Math.SQRT2}" height="${2*v*scale/Math.SQRT2}" fill="none" stroke="var(--line)"/>`).join("");
  const diag = ORDER.map(t => { const e = R/Math.SQRT2; return `<line x1="${cx}" y1="${cy}" x2="${cx+dir[t][0]*e}" y2="${cy+dir[t][1]*e}" stroke="var(--line)" stroke-dasharray="2 3"/>`; }).join("");
  const tickLabels = ticks.map(v => { const k=v*scale/Math.SQRT2; return `<text x="${cx+k+3}" y="${cy-k-3}" font-size="10" fill="var(--muted)">${v}</text>`; }).join("");

  const quadLabel = t => {
    const e = R/Math.SQRT2 + 16, x = cx+dir[t][0]*e, y = cy+dir[t][1]*e + (dir[t][1]>0?12:-2);
    const on = shown.includes(t);
    return `<text x="${x}" y="${y}" text-anchor="${dir[t][0]<0?"end":"start"}" font-size="13" font-weight="${on?700:500}" fill="${on?`var(--${t})`:"var(--muted)"}">${t}(${TYPES[t].name})</text>`;
  };
  const dots = ORDER.map(t => {
    const [x,y] = pt(t), on = shown.includes(t);
    return `${on?`<circle cx="${x}" cy="${y}" r="13" fill="var(--${t})" opacity=".2"/>`:""}
      <circle cx="${x}" cy="${y}" r="${on?6.5:4.5}" fill="var(--${t})" ${on?"":'opacity=".6"'}/>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="D ${c.D}개, I ${c.I}개, S ${c.S}개, C ${c.C}개를 네 방향에 표시한 스타일 도표">
    ${rings}${diag}
    <line x1="${cx-R-8}" y1="${cy}" x2="${cx+R+8}" y2="${cy}" stroke="var(--muted)" stroke-opacity=".6"/>
    <line x1="${cx}" y1="${cy-R-8}" x2="${cx}" y2="${cy+R+8}" stroke="var(--muted)" stroke-opacity=".6"/>
    <text x="${cx}" y="${cy-R-16}" text-anchor="middle" font-size="12" fill="var(--muted)">업무중심</text>
    <text x="${cx}" y="${cy+R+26}" text-anchor="middle" font-size="12" fill="var(--muted)">사람중심</text>
    <text x="${cx-R-10}" y="${cy-8}" text-anchor="end" font-size="12" fill="var(--muted)">반응적</text>
    <text x="${cx+R+10}" y="${cy-8}" text-anchor="start" font-size="12" fill="var(--muted)">주도적</text>
    ${tickLabels}
    <polygon points="${poly}" fill="var(--accent)" fill-opacity=".12" stroke="var(--text)" stroke-opacity=".6" stroke-width="1.4"/>
    ${dots}
    ${ORDER.map(quadLabel).join("")}
  </svg>`;
}

/* 배경의 별 */
(function sky(){
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dots = [];
  function size(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    dots = Array.from({length:Math.round(W*H/22000)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.3, p:Math.random()*6.28}));
  }
  function draw(t){
    const col = getComputedStyle(document.documentElement).getPropertyValue("--star").trim();
    ctx.clearRect(0,0,W,H); ctx.fillStyle = col; ctx.strokeStyle = col;
    for(const d of dots){ ctx.globalAlpha = still ? .6 : .35 + .35*Math.sin(t/1800 + d.p); ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.28); ctx.fill(); }
    ctx.globalAlpha = .12; ctx.lineWidth = .6;
    for(let i=0;i<dots.length;i++) for(let j=i+1;j<dots.length;j++){
      const a=dots[i], b=dots[j], dx=a.x-b.x, dy=a.y-b.y;
      if(dx*dx+dy*dy < 8100){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    if(!still) requestAnimationFrame(draw);
  }
  size(); window.addEventListener("resize", () => { size(); if(still) draw(0); });
  still ? draw(0) : requestAnimationFrame(draw);
})();

render();
</script>
